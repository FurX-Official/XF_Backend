spring:
  datasource:
    url: jdbc:h2:mem:xfdev;DB_CLOSE_DELAY=-1;MODE=POSTGRESQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWNoYW5nZS1pbi1wcm9k
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
  issuer: XF_Backend

logging:
  level:
    com.xf.backend: DEBUG
    org.springframework.security: TRACE
